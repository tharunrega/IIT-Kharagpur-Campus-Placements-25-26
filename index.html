<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Placement JD 2025–2026</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f13;
      --surface: #1a1a24;
      --surface2: #22223a;
      --border: #2e2e45;
      --accent: #6c63ff;
      --text: #e8e8f0;
      --muted: #8888aa;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
    }

    /* HEADER */
    .header {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      padding: 36px 24px 28px;
      text-align: center;
      border-bottom: 1px solid var(--border);
    }

    .header h1 {
      font-size: clamp(1.5rem, 4vw, 2.2rem);
      font-weight: 800;
      background: linear-gradient(135deg, #a78bfa, #60a5fa, #34d399);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 6px;
    }

    .header p { color: var(--muted); font-size: 0.88rem; margin-bottom: 20px; }

    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      max-width: 960px;
      margin: 0 auto;
    }

    .search-wrap {
      position: relative;
      flex: 1;
      min-width: 220px;
      max-width: 380px;
    }

    .search-wrap svg {
      position: absolute;
      left: 13px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
    }

    input[type="text"] {
      width: 100%;
      padding: 11px 12px 11px 40px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-size: 0.93rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus { border-color: var(--accent); }
    input[type="text"]::placeholder { color: var(--muted); }

    select {
      padding: 11px 14px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-size: 0.88rem;
      outline: none;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    select:focus { border-color: var(--accent); }

    /* STATS */
    .stats {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
      padding: 12px 24px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      font-size: 0.83rem;
      color: var(--muted);
    }

    .stats span { color: var(--text); font-weight: 600; }

    /* SORT BAR */
    .sort-bar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      padding: 12px 24px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      align-items: center;
    }

    .sort-label { font-size: 0.78rem; color: var(--muted); margin-right: 2px; }

    .sort-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 5px 13px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--muted);
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.18s;
      user-select: none;
    }

    .sort-btn:hover { border-color: var(--accent); color: var(--text); }
    .sort-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

    /* GRID */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
      gap: 14px;
      padding: 20px 24px;
      max-width: 1440px;
      margin: 0 auto;
    }

    /* CARD */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: transform 0.18s, border-color 0.18s, box-shadow 0.18s;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, #6c63ff, #60a5fa);
      opacity: 0;
      transition: opacity 0.18s;
    }

    .card:hover {
      transform: translateY(-3px);
      border-color: var(--accent);
      box-shadow: 0 8px 28px rgba(108,99,255,0.15);
    }

    .card:hover::before { opacity: 1; }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }

    .company-name {
      font-size: 0.97rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.3;
    }

    .ctc-badge {
      flex-shrink: 0;
      padding: 3px 9px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .ctc-high  { background: rgba(34,197,94,.15);  color: #4ade80; border: 1px solid rgba(34,197,94,.3); }
    .ctc-mid   { background: rgba(96,165,250,.15); color: #93c5fd; border: 1px solid rgba(96,165,250,.3); }
    .ctc-low   { background: rgba(245,158,11,.15); color: #fcd34d; border: 1px solid rgba(245,158,11,.3); }
    .ctc-na    { background: rgba(136,136,170,.1); color: var(--muted); border: 1px solid var(--border); }
    .ctc-intl  { background: rgba(255,101,132,.15);color: #fca5a5; border: 1px solid rgba(255,101,132,.3); }

    .role-name { font-size: 0.88rem; color: #a0a0c0; line-height: 1.4; }

    .divider { height: 1px; background: var(--border); }

    .dates {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .date-item { display: flex; flex-direction: column; gap: 1px; }
    .date-label { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
    .date-value { font-size: 0.83rem; font-weight: 600; color: var(--text); }
    .date-time  { font-size: 0.73rem; color: var(--muted); }

    .deadline-soon .date-value { color: #f59e0b; }
    .deadline-past .date-value  { color: #ef4444; }

    .card-footer { display: flex; justify-content: flex-end; margin-top: 2px; }

    .open-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 7px 18px;
      background: linear-gradient(135deg, #6c63ff, #42a1ff);
      color: #fff;
      border-radius: 9px;
      font-size: 0.85rem;
      font-weight: 600;
      text-decoration: none;
      transition: opacity 0.18s, transform 0.15s;
    }

    .open-btn:hover { opacity: 0.85; transform: scale(1.04); }

    /* EMPTY */
    .empty {
      grid-column: 1/-1;
      text-align: center;
      padding: 80px 20px;
      color: var(--muted);
    }

    .empty p { font-size: 1.05rem; margin-top: 16px; }

    /* PAGINATION */
    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      padding: 24px;
      flex-wrap: wrap;
    }

    .page-btn {
      padding: 7px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--muted);
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.18s;
    }

    .page-btn:hover { border-color: var(--accent); color: var(--text); }
    .page-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .page-btn:disabled { opacity: 0.3; cursor: default; }

    @media (max-width: 600px) {
      .grid { padding: 14px; gap: 10px; }
      .sort-bar, .stats { padding: 10px 14px; }
    }
  </style>
</head>

let sortCol = "ctc", sortDir = -1, currentPage = 1;

function parseCTC(s) {
  if (!s || s === "Not specified") return -1;
  const m = s.match(/([\d.]+)\s*LPA/i);
  return m ? parseFloat(m[1]) : -2;
}

function isIntl(s) { return s && s !== "Not specified" && !s.match(/LPA/i); }

function ctcClass(s) {
  if (!s || s === "Not specified") return "ctc-na";
  if (isIntl(s)) return "ctc-intl";
  const v = parseCTC(s);
  if (v >= 30) return "ctc-high";
  if (v >= 15) return "ctc-mid";
  return "ctc-low";
}

function dlClass(d) {
  const diff = (new Date(d) - new Date()) / 86400000;
  if (diff < 0) return "deadline-past";
  if (diff < 3) return "deadline-soon";
  return "";
}

function setSort(col) {
  sortDir = sortCol === col ? sortDir * -1 : (col === "ctc" ? -1 : 1);
  sortCol = col;
  currentPage = 1;
  document.querySelectorAll(".sort-btn").forEach(b => {
    b.classList.toggle("active", b.dataset.col === col);
    b.querySelector(".arrow").textContent = b.dataset.col === col ? (sortDir === -1 ? "↓" : "↑") : "↕";
  });
  render();
}

function applyAll() { currentPage = 1; render(); }

function getFiltered() {
  const q = document.getElementById("searchInput").value.toLowerCase().trim();
  const cf = document.getElementById("ctcFilter").value;
  return RAW.filter(r => {
    const [co, ro, ctc] = r;
    if (q && !co.toLowerCase().includes(q) && !ro.toLowerCase().includes(q) && !ctc.toLowerCase().includes(q)) return false;
    if (cf) {
      const v = parseCTC(ctc);
      if (cf === "na")    return ctc === "Not specified";
      if (cf === "intl")  return isIntl(ctc);
      if (cf === "0-10")  return v >= 0 && v < 10;
      if (cf === "10-20") return v >= 10 && v < 20;
      if (cf === "20-30") return v >= 20 && v < 30;
      if (cf === "30-50") return v >= 30 && v < 50;
      if (cf === "50+")   return v >= 50;
    }
    return true;
  });
}

function getSorted(data) {
  return [...data].sort((a, b) => {
    if (sortCol === "company")  return sortDir * a[0].toLowerCase().localeCompare(b[0].toLowerCase());
    if (sortCol === "role")     return sortDir * a[1].toLowerCase().localeCompare(b[1].toLowerCase());
    if (sortCol === "ctc")      return sortDir * (parseCTC(a[2]) - parseCTC(b[2]));
    if (sortCol === "cvOpen")   return sortDir * (a[3]+a[4]).localeCompare(b[3]+b[4]);
    if (sortCol === "deadline") return sortDir * (a[5]+a[6]).localeCompare(b[5]+b[6]);
    return 0;
  });
}

function esc(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function render() {
  const filtered = getFiltered();
  const sorted = getSorted(filtered);
  const pp = parseInt(document.getElementById("perPage").value);
  const totalPages = Math.max(1, Math.ceil(sorted.length / pp));
  currentPage = Math.min(currentPage, totalPages);
  const slice = sorted.slice((currentPage-1)*pp, currentPage*pp);

  document.getElementById("countShown").textContent = filtered.length;
  document.getElementById("countTotal").textContent = RAW.length;
  document.getElementById("pageInfo").textContent = totalPages > 1 ? currentPage + " / " + totalPages : "1";

  const lpas = filtered.map(r => parseCTC(r[2])).filter(v => v > 0);
  document.getElementById("highCTC").textContent = lpas.length ? Math.max(...lpas).toFixed(1) + " LPA" : "—";

  const grid = document.getElementById("grid");

  if (!slice.length) {
    grid.innerHTML = `<div class="empty"><p>No listings match your search.</p></div>`;
    document.getElementById("pagination").innerHTML = "";
    return;
  }

  grid.innerHTML = slice.map(r => {
    const [co, ro, ctc, cvD, cvT, dlD, dlT, link] = r;
    return `<div class="card">
      <div class="card-top">
        <div class="company-name">${esc(co)}</div>
        <div class="ctc-badge ${ctcClass(ctc)}">${esc(ctc)}</div>
      </div>
      <div class="role-name">${esc(ro)}</div>
      <div class="divider"></div>
      <div class="dates">
        <div class="date-item">
          <span class="date-label">CV Open</span>
          <span class="date-value">${cvD}</span>
          <span class="date-time">${cvT}</span>
        </div>
        <div class="date-item ${dlClass(dlD+"T"+dlT)}">
          <span class="date-label">Deadline</span>
          <span class="date-value">${dlD}</span>
          <span class="date-time">${dlT}</span>
        </div>
      </div>
      <div class="card-footer">
        <a class="open-btn" href="${BASE}${link}" target="_blank" rel="noopener">
          Open
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
            <polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>
          </svg>
        </a>
      </div>
    </div>`;
  }).join("");

  // Pagination
  if (totalPages <= 1) { document.getElementById("pagination").innerHTML = ""; return; }
  let pages = [];
  pages.push(`<button class="page-btn" onclick="goPage(${currentPage-1})" ${currentPage===1?"disabled":""}>← Prev</button>`);
  for (let i = 1; i <= totalPages; i++) {
    if (i === 1 || i === totalPages || (i >= currentPage-2 && i <= currentPage+2)) {
      pages.push(`<button class="page-btn ${i===currentPage?"active":""}" onclick="goPage(${i})">${i}</button>`);
    } else if (i === currentPage-3 || i === currentPage+3) {
      pages.push(`<span style="color:var(--muted);padding:0 4px">…</span>`);
    }
  }
  pages.push(`<button class="page-btn" onclick="goPage(${currentPage+1})" ${currentPage===totalPages?"disabled":""}>Next →</button>`);
  document.getElementById("pagination").innerHTML = pages.join("");
}

function goPage(p) { currentPage = p; render(); window.scrollTo({top:0,behavior:"smooth"}); }

render();
</script>
